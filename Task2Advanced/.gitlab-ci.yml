stages:
  - validate
  - plan
  - apply
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Task2Advanced/**/*
        - Task2Advanced/.gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - Task2Advanced/**/*
        - Task2Advanced/.gitlab-ci.yml
    - when: never
default:
  image:
    name: hashicorp/terraform:1.15.6
    entrypoint: [ "" ]
  cache:
    key: "terraform-plugins-${CI_COMMIT_REF_SLUG}-${CI_RUNNER_EXECUTABLE_ARCH}"
    paths:
      - .terraform.d/plugin-cache/
  before_script:
    - mkdir -p "$TF_PLUGIN_CACHE_DIR"
variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: "$CI_PROJECT_DIR/.terraform.d/plugin-cache"

.task2_changes:
  rules:
    - changes:
        - Task2Advanced/**/*
        - Task2Advanced/.gitlab-ci.yml
validate:
  stage: validate
  extends: .task2_changes
  script:
    - terraform fmt -check -recursive Task2Advanced
    - |
      for environment in dev stage prod; do
        terraform -chdir="Task2Advanced/envs/${environment}" init -backend=false -lockfile=readonly
        terraform -chdir="Task2Advanced/envs/${environment}" validate
      done
.plan:
  stage: plan
  resource_group: "task2-${TF_ENV}"
  environment:
    name: "$TF_ENV"
    action: prepare
  script:
    - terraform -chdir="$TF_ROOT" init -reconfigure -lockfile=readonly -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=task2/${TF_ENV}/terraform.tfstate"
    - terraform -chdir="$TF_ROOT" plan -lock-timeout=5m -var-file="${TF_ENV}.tfvars" -out=tfplan
    - terraform -chdir="$TF_ROOT" show -no-color tfplan > "$TF_ROOT/tfplan.txt"
  artifacts:
    name: "terraform-plan-${TF_ENV}-${CI_COMMIT_SHORT_SHA}"
    access: developer
    expire_in: 1 hour
    paths:
      - "$TF_ROOT/tfplan"
      - "$TF_ROOT/tfplan.txt"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - Task2Advanced/**/*
        - Task2Advanced/.gitlab-ci.yml
    - when: never
plan_dev:
  extends: .plan
  variables:
    TF_ENV: dev
    TF_ROOT: Task2Advanced/envs/dev
plan_stage:
  extends: .plan
  variables:
    TF_ENV: stage
    TF_ROOT: Task2Advanced/envs/stage
plan_prod:
  extends: .plan
  variables:
    TF_ENV: prod
    TF_ROOT: Task2Advanced/envs/prod
.apply:
  stage: apply
  resource_group: "task2-${TF_ENV}"
  environment:
    name: "$TF_ENV"
    action: start
  script:
    - terraform -chdir="$TF_ROOT" init -reconfigure -lockfile=readonly -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=task2/${TF_ENV}/terraform.tfstate"
    - terraform -chdir="$TF_ROOT" apply -lock-timeout=5m tfplan
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
      changes:
        - Task2Advanced/**/*
        - Task2Advanced/.gitlab-ci.yml
    - when: never
apply_dev:
  extends: .apply
  variables:
    TF_ENV: dev
    TF_ROOT: Task2Advanced/envs/dev
  needs:
    - job: plan_dev
      artifacts: true
apply_stage:
  extends: .apply
  variables:
    TF_ENV: stage
    TF_ROOT: Task2Advanced/envs/stage
  needs:
    - job: plan_stage
      artifacts: true
apply_prod:
  extends: .apply
  variables:
    TF_ENV: prod
    TF_ROOT: Task2Advanced/envs/prod
  needs:
    - job: plan_prod
      artifacts: true
